<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>18505_MP_2026B</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      background: #111;
    }

    #panorama {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }

    .menu-panel {
      position: absolute;
      z-index: 30;
      background: rgba(242, 242, 242, 0.97);
      border-radius: 12px;
      padding: 10px;
      min-width: 250px;
      max-width: calc(100vw - 24px);
      box-shadow: 0 6px 22px rgba(0,0,0,0.28);
      display: none;
      color: #333;
    }

    .menu-panel button,
    .hamburger-btn {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #e7e7e7;
      color: #333;
      font-size: 14px;
    }

    .menu-panel button {
      display: block;
      width: 100%;
      margin: 6px 0;
      padding: 11px 12px;
      text-align: left;
    }

    .menu-panel button:hover,
    .hamburger-btn:hover {
      background: #d7d7d7;
    }

    .hamburger-wrap {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 35;
    }

    .hamburger-btn {
      width: 56px;
      height: 56px;
      font-size: 24px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.28);
      background: rgba(242, 242, 242, 0.96);
    }

    .cursor-loader {
      position: absolute;
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255,255,255,0.45);
      border-top-color: rgba(255,255,255,0.98);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      pointer-events: none;
      display: none;
      z-index: 50;
      box-shadow: 0 0 10px rgba(0,0,0,0.18);
    }

    .cursor-loader.visible {
      display: block;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .menu-panel {
        right: 12px !important;
        left: 12px !important;
        bottom: 84px !important;
        top: auto !important;
        min-width: auto;
        width: auto;
      }

      .menu-panel button {
        font-size: 16px;
        padding: 13px 14px;
      }

      .hamburger-btn {
        width: 60px;
        height: 60px;
        font-size: 26px;
      }

      .cursor-loader {
        width: 24px;
        height: 24px;
      }
    }
  </style>
</head>
<body>

<div id="panorama"></div>
<div id="menuPanel" class="menu-panel"></div>
<div id="cursorLoader" class="cursor-loader"></div>

<div class="hamburger-wrap">
  <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">☰</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.105.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/pchen66/panolens.js@0.10.2/build/panolens.min.js"></script>

<script>
  const panorama = new PANOLENS.ImagePanorama('fin.jpeg');

  const viewer = new PANOLENS.Viewer({
    container: document.getElementById('panorama'),
    controlBar: false,
    autoRotate: false,
    output: 'console'
  });

  viewer.add(panorama);

  const cursorLoader = document.getElementById('cursorLoader');

  function showLoader() {
    cursorLoader.style.left = (window.innerWidth / 2 - 13) + 'px';
    cursorLoader.style.top = (window.innerHeight / 2 - 13) + 'px';
    cursorLoader.classList.add('visible');
  }

  function hideCursorLoader() {
    cursorLoader.classList.remove('visible');
  }

  function openFile(file) {
    window.open(file, '_blank');
    closeMenu();
  }

  function openHamburgerMenu() {
    const panel = document.getElementById('menuPanel');

    if (panel.style.display === 'block') {
      closeMenu();
      return;
    }

    panel.innerHTML = '';

    const items = [
      {
        label: 'View draft',
        action: () => openFile('18505_MP_2026_A3V7_8B.pdf')
      },
      {
        label: 'Topdown with draft',
        action: () => openFile('3rd.png')
      },
      {
        label: 'Topdown render',
        action: () => openFile('2nd.png')
      },
      {
        label: 'Go to 18505_MP_2026A',
        action: () => openFile('https://kemeis.github.io/18505_MP_2026A/')
      },
      {
        label: 'Credentials',
        action: () => openFile('https://kabaszyn.dev/')
      }
    ];

    items.forEach(i => {
      const b = document.createElement('button');
      b.textContent = i.label;
      b.onclick = i.action;
      panel.appendChild(b);
    });

    if (window.innerWidth <= 768) {
      panel.style.left = '12px';
      panel.style.right = '12px';
      panel.style.bottom = '84px';
      panel.style.top = 'auto';
    } else {
      panel.style.right = '16px';
      panel.style.left = 'auto';
      panel.style.bottom = '84px';
      panel.style.top = 'auto';
    }

    panel.style.display = 'block';
  }

  function closeMenu() {
    document.getElementById('menuPanel').style.display = 'none';
  }

  document.getElementById('hamburgerBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    openHamburgerMenu();
  });

  document.addEventListener('click', (e) => {
    const panel = document.getElementById('menuPanel');
    const hamburger = document.getElementById('hamburgerBtn');
    if (!panel.contains(e.target) && e.target !== hamburger) closeMenu();
  });

  panorama.addEventListener('enter-fade-start', () => {
    setTimeout(() => {
      hideCursorLoader();
    }, 250);
  });

  // ===== DEBUG: click panorama and read XYZ/yaw/pitch in console =====
  function xyzToYawPitch(x, y, z) {
    const radius = Math.sqrt(x*x + y*y + z*z);
    const yaw = Math.atan2(x, -z) * 180 / Math.PI;
    const pitch = Math.asin(y / radius) * 180 / Math.PI;
    return {
      yaw: Math.round(yaw),
      pitch: Math.round(pitch)
    };
  }

  panorama.addEventListener('click', function(event) {
    if (!event.intersects || !event.intersects.length) return;

    const point = event.intersects[0].point;
    const x = Math.round(point.x);
    const y = Math.round(point.y);
    const z = Math.round(point.z);
    const ang = xyzToYawPitch(point.x, point.y, point.z);

    console.log('----------------------------------');
    console.log('Project: 18505_MP_2026B');
    console.log('Panorama: fin.jpeg');
    console.log(`XYZ: ${x}, ${y}, ${z}`);
    console.log(`Yaw/Pitch: ${ang.yaw}°, ${ang.pitch}°`);
    console.log(`spot.position.set(${x}, ${y}, ${z});`);
    console.log(`// or use angles: yaw ${ang.yaw}, pitch ${ang.pitch}`);
    console.log('----------------------------------');
  });

  showLoader();
  viewer.setPanorama(panorama);
  window.viewer = viewer;
</script>

</body>
</html>
